name: Compilar APK - Lotofacil Pareto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Conferir estrutura do projeto
        run: |
          echo "======================================"
          echo " LOTOFACIL PARETO - ESTRUTURA"
          echo "======================================"
          pwd
          ls -la
          echo ""
          echo "Arquivos do APP:"
          find app -maxdepth 4 -type f | sort || true

          test -f settings.gradle.kts || {
            echo "ERRO: settings.gradle.kts nao encontrado"
            exit 1
          }

          test -f build.gradle.kts || {
            echo "ERRO: build.gradle.kts nao encontrado"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "ERRO: app/build.gradle.kts nao encontrado"
            exit 1
          }

          echo "Estrutura principal OK."

      - name: Mostrar versao do Gradle
        run: gradle --version

      - name: Compilar APK Debug
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Localizar APK gerado
        run: |
          echo "======================================"
          echo " APK GERADO"
          echo "======================================"

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao foi encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK"

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LOTOFACIL-PARETO-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
